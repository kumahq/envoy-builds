name: Build
run-name: Build linux-${{ inputs.arch }}-v${{ inputs.version }}${{ inputs.fips && '+fips' || '' }}

on:
  workflow_call:
    inputs:
      version:
        description: Envoy version to build (don't include leading v)
        type: string
        required: true
      arch:
        description: Architecture to build Envoy for Linux
        type: string
        required: true
      fips:
        description: Build FIPS (only linux amd64)
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ACCOUNT_ID:
        description: AWS account ID for infrastructure
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Envoy version to build (don't include leading v)
        type: string
        required: true
      arch:
        options:
          - amd64
          - arm64
        description: Architecture to build Envoy for Linux
        type: choice
        required: true
      fips:
        description: Build FIPS (only linux amd64)
        required: false
        default: false
        type: boolean
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SSH_USER: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO use aws ssm
      - name: Generate SSH key
        run: |
          ssh-keygen -t ed25519 -q -N "" -f ~/.ssh/id_aws
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/envoy-ci
          role-duration-seconds: 10800
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init
        working-directory: terraform
      - name: Set terraform variables
        working-directory: terraform
        env:
          ARCH: ${{ inputs.arch }}
          FIPS: ${{ inputs.fips }}
          VERSION: ${{ inputs.version }}
        run: |
          cat <<EOF >> terraform.tfvars
          public_key_path = "~/.ssh/id_aws.pub"
          arch = "${ARCH}"
          fips = ${FIPS}
          envoy_version = "${VERSION}"
          EOF
      - run: terraform apply -input=false -auto-approve
        working-directory: terraform
        id: terraform-apply
      - id: public-ip
        working-directory: terraform
        # setup-terraform saves stdout of terraform calls to outputs
        run: terraform output --raw public_ip
      - id: instance-id
        working-directory: terraform
        # setup-terraform saves stdout of terraform calls to outputs
        run: terraform output -raw instance_id
      - name: Wait for VM to be ready
        working-directory: terraform
        timeout-minutes: 90
        env:
          PUBLIC_IP: ${{ steps.public-ip.outputs.stdout }}
        run: |
          while ! timeout 10 ssh -i ~/.ssh/id_aws -o BatchMode=yes -o StrictHostKeyChecking=accept-new "${SSH_USER}@${PUBLIC_IP}" 'test -e ready'
          do
            sleep 5
          done
      - name: Build Envoy
        env:
          VERSION: ${{ inputs.version }}
          FIPS: ${{ inputs.fips }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          PUBLIC_IP: ${{ steps.public-ip.outputs.stdout }}
        run: |
          # Write build script to temp file (single-quoted heredoc prevents expansion)
          cat > /tmp/build-envoy.sh <<'SCRIPT'
          set -e
          export ENVOY_VERSION="$VERSION"
          git clone "https://github.com/$REPO" && cd "${REPO#${REPO_OWNER}/}"
          git checkout "$COMMIT_SHA"

          if [[ "$FIPS" == true ]]; then
            make build/envoy/fips
          else
            make build/envoy
          fi

          mv build ..
          SCRIPT

          # Upload and execute build script with safely-quoted env vars
          scp -i ~/.ssh/id_aws -o StrictHostKeyChecking=accept-new /tmp/build-envoy.sh "${SSH_USER}@${PUBLIC_IP}:/tmp/build-envoy.sh"
          ssh -i ~/.ssh/id_aws "${SSH_USER}@${PUBLIC_IP}" \
            "$(printf 'export VERSION=%q FIPS=%q REPO=%q REPO_OWNER=%q COMMIT_SHA=%q;' \
              "$VERSION" "$FIPS" "$REPO" "$REPO_OWNER" "$COMMIT_SHA") bash /tmp/build-envoy.sh"
      - name: Download Envoy binaries
        env:
          INPUT_ARCH: ${{ inputs.arch }}
          PUBLIC_IP: ${{ steps.public-ip.outputs.stdout }}
        run: |
            envoy_dir="~/build/artifacts-linux-${INPUT_ARCH}/envoy"
            scp -i ~/.ssh/id_aws -o StrictHostKeyChecking=accept-new -r "${SSH_USER}@${PUBLIC_IP}:${envoy_dir}" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-linux-${{ inputs.arch }}-${{ inputs.version }}-${{ inputs.fips }}
          path: envoy/
          if-no-files-found: error
      - run: terraform destroy -input=false -auto-approve
        working-directory: terraform
        if: always() && steps.terraform-apply.outcome != 'skipped'
