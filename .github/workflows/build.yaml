name: Build
run-name: Build linux-${{ inputs.arch }}-v${{ inputs.version }}${{ inputs.fips && '+fips' || '' }}

on:
  workflow_call:
    inputs:
      version:
        description: Envoy version to build (don't include leading v)
        type: string
        required: true
      arch:
        description: Architecture to build Envoy for Linux
        type: string
        required: true
      fips:
        description: Build FIPS (only linux amd64)
        required: false
        default: false
        type: boolean
    secrets:
      AWS_ACCOUNT_ID:
        description: AWS account ID for infrastructure
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Envoy version to build (don't include leading v)
        type: string
        required: true
      arch:
        options:
          - amd64
          - arm64
        description: Architecture to build Envoy for Linux
        type: choice
        required: true
      fips:
        description: Build FIPS (only linux amd64)
        required: false
        default: false
        type: boolean
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Session Manager plugin
        run: |
          if ! command -v session-manager-plugin >/dev/null; then
            curl -fsSL -o /tmp/session-manager-plugin.deb \
              https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
            sudo dpkg -i /tmp/session-manager-plugin.deb
          fi
      - name: Generate SSH key
        run: |
          ssh-keygen -t ed25519 -q -N "" -f ~/.ssh/id_aws
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/envoy-ci
          role-duration-seconds: 10800
          aws-region: us-east-2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform init
        working-directory: terraform
      - name: Set terraform variables
        working-directory: terraform
        env:
          ARCH: ${{ inputs.arch }}
          FIPS: ${{ inputs.fips }}
          VERSION: ${{ inputs.version }}
        run: |
          cat <<EOF >> terraform.tfvars
          public_key_path = "~/.ssh/id_aws.pub"
          arch = "${ARCH}"
          fips = ${FIPS}
          envoy_version = "${VERSION}"
          EOF
      - run: terraform apply -input=false -auto-approve
        working-directory: terraform
        id: terraform-apply
      - id: instance-id
        working-directory: terraform
        # setup-terraform saves stdout of terraform calls to outputs
        run: terraform output -raw instance_id
      - name: Configure SSH over SSM
        env:
          INSTANCE_ID: ${{ steps.instance-id.outputs.stdout }}
        run: |
          cat <<EOF >> ~/.ssh/config
          Host build-vm
            HostName ${INSTANCE_ID}
            User admin
            IdentityFile ~/.ssh/id_aws
            StrictHostKeyChecking accept-new
            ServerAliveInterval 60
            ProxyCommand aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p
          EOF
      - name: Wait for VM to be ready
        timeout-minutes: 90
        env:
          INSTANCE_ID: ${{ steps.instance-id.outputs.stdout }}
        run: |
          until [[ "$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' --output text)" == Online ]]
          do
            sleep 5
          done
          while ! timeout 30 ssh -o BatchMode=yes build-vm 'test -e ready'
          do
            sleep 5
          done
      - name: Build Envoy
        env:
          VERSION: ${{ inputs.version }}
          FIPS: ${{ inputs.fips }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Bake safely-quoted env vars into the script, then append the body
          # (single-quoted heredoc prevents expansion)
          printf 'export VERSION=%q FIPS=%q REPO=%q REPO_OWNER=%q COMMIT_SHA=%q\n' \
            "$VERSION" "$FIPS" "$REPO" "$REPO_OWNER" "$COMMIT_SHA" > /tmp/build-envoy.sh
          cat >> /tmp/build-envoy.sh <<'SCRIPT'
          set -e
          export ENVOY_VERSION="$VERSION"
          git clone "https://github.com/$REPO" && cd "${REPO#${REPO_OWNER}/}"
          git checkout "$COMMIT_SHA"

          if [[ "$FIPS" == true ]]; then
            make build/envoy/fips
          else
            make build/envoy
          fi

          mv build ..
          SCRIPT

          scp /tmp/build-envoy.sh build-vm:/tmp/build-envoy.sh
          ssh build-vm bash /tmp/build-envoy.sh
      - name: Download Envoy binaries
        env:
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
            # relative remote paths resolve against the VM user's home
            scp -r "build-vm:build/artifacts-linux-${INPUT_ARCH}/envoy" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: envoy-linux-${{ inputs.arch }}-${{ inputs.version }}-${{ inputs.fips }}
          path: envoy/
          if-no-files-found: error
      - run: terraform destroy -input=false -auto-approve
        working-directory: terraform
        if: always() && steps.terraform-apply.outcome != 'skipped'
