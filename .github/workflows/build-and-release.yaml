name: Build and release
run-name: "Build ${{ !inputs.skip-release && 'and release ' || '' }}v${{ inputs.version }}${{ inputs.suffix }}"

on:
  workflow_call:
    inputs:
      version:
        description: Envoy version to build (don't include leading v)
        type: string
        required: true
    secrets:
      AWS_ACCOUNT_ID:
        description: AWS account ID for infrastructure
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Envoy version to build (don't include leading v, don't cancel the build because things might not be cleaned up by terraform properly)
        type: string
        required: true
      suffix:
        description: Additional suffix for release/tag (must include leading '-' if desired)
        type: string
      skip-release:
        description: Skip the release?
        type: boolean
        required: false
  schedule:
    - cron: 0 4 * * 1

permissions:
  id-token: write
  contents: write

jobs:
  check-input:
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if version starts with "v"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ $VERSION == v* ]]; then
            echo "Run this action without 'v' prefix - ${VERSION:1}. Don't cancel a build in progress build because things might not be cleaned up by terraform"
            exit 1
          fi
        shell: bash

  build-linux:
    needs: check-input
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, fips: false }
          - { arch: amd64, fips: true }
          - { arch: arm64, fips: false }
    uses: ./.github/workflows/build.yaml
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    with:
      os: linux
      arch: ${{ matrix.arch }}
      fips: ${{ matrix.fips }}
      version: ${{ inputs.version || 'main' }}

  build-darwin:
    needs: check-input
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    uses: ./.github/workflows/build-github.yaml
    with:
      os: darwin
      arch: ${{ matrix.arch }}
      fips: false
      version: ${{ inputs.version || 'main' }}

  package:
    runs-on: ubuntu-24.04
    needs: [build-linux, build-darwin]
    # Run even when a build leg failed so the binaries that did build are still
    # packaged and downloadable. The release itself stays gated on a complete
    # set (see "Verify all platforms built" below).
    if: ${{ !cancelled() }}
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: envoy-*-${{ inputs.version || 'main' }}-*
      - env:
          SUFFIX: ${{ inputs.suffix }}
        run: |
          # No match must leave the loop empty rather than iterating the literal
          # glob, so an all-legs-failed run still reaches the verify step below.
          shopt -s nullglob
          mkdir out
          for dir in envoy*; do
            IFS=- read -r envoy os arch version fips <<< "${dir}"
            for bin in "${dir}"/*; do
              chmod +x "${bin}"

              bin="$(basename "${bin}")"
              archive_name="envoy-${os}-${arch}-v${version}${SUFFIX}"
              if [[ "${fips}" == "true" ]]; then
                archive_name="${archive_name}+fips"
              fi

              # move file into tar.gz and rename to 'envoy' in archive
              tar -C "${dir}" "--transform=flags=r;s|${bin}|envoy|" -czvf "out/${archive_name}.tar.gz" "${bin}"
            done
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-v${{ inputs.version }}${{ inputs.suffix }}
          path: out/
          # "Verify all platforms built" reports missing legs precisely; this
          # step must not pre-empt it with a generic error.
          if-no-files-found: warn
      # A release missing a platform is worse than no release, so name the gaps
      # and fail instead. Re-running the failed leg completes the set; the
      # tarballs above are kept either way.
      - name: Verify all platforms built
        env:
          VERSION: ${{ inputs.version || 'main' }}
          SUFFIX: ${{ inputs.suffix }}
        run: |
          missing=()
          for archive in \
            "envoy-linux-amd64-v${VERSION}${SUFFIX}.tar.gz" \
            "envoy-linux-amd64-v${VERSION}${SUFFIX}+fips.tar.gz" \
            "envoy-linux-arm64-v${VERSION}${SUFFIX}.tar.gz" \
            "envoy-darwin-amd64-v${VERSION}${SUFFIX}.tar.gz" \
            "envoy-darwin-arm64-v${VERSION}${SUFFIX}.tar.gz"
          do
            [[ -f "out/${archive}" ]] || missing+=("${archive}")
          done

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::No release created - missing ${#missing[@]} archive(s): ${missing[*]}. Re-run the failed build job(s), then re-run this job."
            exit 1
          fi
          echo "All 5 platform archives present."
      - name: Release
        if: ${{ !inputs.skip-release }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ inputs.version || 'main' }}${{ inputs.suffix }}
          draft: true
          files: |
            out/*
